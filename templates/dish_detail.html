<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ dish[0] }} - FoodFlow</title>
    <style>
        body { font-family: 'YS Text', 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; }
        .header { background-color: #1e1e1e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .header h1 { margin: 0; font-size: 24px; color: #ffd700; }
        .header a { color: #ccc; text-decoration: none; }

        .container { max-width: 900px; margin: 40px auto; padding: 20px; display: flex; gap: 40px; background: #1e1e1e; border-radius: 15px; border: 1px solid #333; }

        .image-box { flex: 1; }
        .image-box img { width: 100%; border-radius: 10px; object-fit: cover; }

        .info-box { flex: 1; display: flex; flex-direction: column; }

        .title { font-size: 32px; margin: 0 0 10px 0; }
        .desc { color: #aaa; line-height: 1.5; margin-bottom: 20px; }

        .kbju { display: flex; gap: 15px; background: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .kbju div { flex: 1; }
        .kbju span { display: block; font-size: 20px; font-weight: bold; color: #ffd700; }
        .kbju small { color: #888; font-size: 12px; text-transform: uppercase; }

        .size-selector { margin-bottom: 20px; }
        .size-selector select { width: 100%; padding: 12px; font-size: 16px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 8px; outline: none; }

        .quantity { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .quantity input { width: 60px; padding: 10px; font-size: 18px; text-align: center; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 8px; }

        .buy-btn { width: 100%; padding: 15px; background-color: #ffd700; color: black; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .buy-btn:hover { background-color: #e6c200; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/"><h1>🍔 FoodFlow</h1></a>
        <a href="/">← Назад в меню</a>
    </div>

    <div class="container">
        <div class="image-box">
            <img src="{{ url_for('static', filename='Image/' + dish[6]) }}" alt="{{ dish[0] }}">
        </div>

        <div class="info-box">
            <div style="color: #888; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;">{{ dish[7] }}</div>
            <h1 class="title">{{ dish[0] }}</h1>
            <p class="desc">{{ dish[1] if dish[1] else 'Вкусное блюдо для отличного настроения.' }}</p>

            <div class="kbju">
                <div><span>{{ dish[2] }}</span><small>Ккал</small></div>
                <div><span>{{ dish[3] }}</span><small>Белки</small></div>
                <div><span>{{ dish[4] }}</span><small>Жиры</small></div>
                <div><span>{{ dish[5] }}</span><small>Углеводы</small></div>
            </div>

            <form action="/order/submit" method="POST">
                <input type="hidden" name="dish_id" value="{{ dish_id }}">

                {% if sizes %}
                    <div class="size-selector">
                        <label style="display:block; margin-bottom:8px; color:#aaa;">Выберите размер:</label>
                        <select name="size_id" required>
                            {% for size in sizes %}
                                <option value="{{ size[0] }}">{{ size[1] }} — {{ size[2] }} ₽</option>
                            {% endfor %}
                        </select>
                    </div>
                {% else %}
                    <input type="hidden" name="size_id" value="none">
                    <div style="margin-bottom:20px;">
                        <span style="color:#ffd700; font-size:24px; font-weight:bold;">{{ dish[8] | round | int }} ₽</span>
                    </div>
                {% endif %}

                <div class="quantity">
                    <label style="color:#aaa;">Количество:</label>
                    <input type="number" name="quantity" value="1" min="1" max="10">
                </div>

                <button type="submit" class="buy-btn">Добавить в заказ</button>
            </form>
        </div>
    </div>
</body>
</html>
